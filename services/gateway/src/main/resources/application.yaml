server:
  port: ${GATEWAY_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState
        liveness:
          include: livenessState

logging:
  config: classpath:logback-spring.xml
