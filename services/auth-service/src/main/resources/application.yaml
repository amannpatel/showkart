server:
  port: ${AUTH_SERVICE_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: auth-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://postgres:5432/auth_db}
    username: ${POSTGRES_USER:showkart}
    password: ${POSTGRES_PASSWORD:change-me-in-local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

logging:
  config: classpath:logback-spring.xml
